name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    - run: dotnet restore TrabajoHuamanga.sln
    - run: dotnet build TrabajoHuamanga.sln --no-restore --configuration Release
    - run: dotnet test TrabajoHuamanga.sln --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: '**/test-results.trx'

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v4
    - name: Verificar Dockerfile
      run: |
        if [ -f Dockerfile ]; then
          docker build -t trabajo-huamanga:${{ github.sha }} .
        else
          echo "Dockerfile pendiente - omitiendo build Docker"
        fi
